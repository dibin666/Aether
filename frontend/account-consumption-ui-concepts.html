<style>
/* ==========================================================================
   Aether Design System Semantic Tokens (Light & Dark)
   ========================================================================== */
:root {

  --font-mono: 'Cascadia Code', 'Cascadia mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;

  --foreground: #3d3929;
  --card: #ffffff;
  --card-foreground: #1a1815;
  --card-subtle: #fbfaf6;

  --secondary: #f0ede5;

  --border: rgba(61, 57, 41, 0.14);
  --border-strong: rgba(61, 57, 41, 0.24);
  --input: #e9e6dc;
  --ring: rgba(201, 100, 66, 0.35);
  --radius: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --shadow-sm: 0 1px 2px 0 rgba(61, 57, 41, 0.05);
  --shadow: 0 1px 3px 0 rgba(61, 57, 41, 0.08), 0 1px 2px -1px rgba(61, 57, 41, 0.08);
  --shadow-md: 0 4px 6px -1px rgba(61, 57, 41, 0.08), 0 2px 4px -2px rgba(61, 57, 41, 0.08);
  --shadow-lg: 0 10px 15px -3px rgba(61, 57, 41, 0.08), 0 4px 6px -4px rgba(61, 57, 41, 0.08);
  --shadow-xl: 0 20px 25px -5px rgba(61, 57, 41, 0.1), 0 8px 10px -6px rgba(61, 57, 41, 0.1);

  /* Status Tokens */
  --emerald-bg: rgba(16, 185, 129, 0.1);
  --emerald-text: #059669;
  --emerald-bar: #10b981;
  --amber-bg: rgba(245, 158, 11, 0.1);
  --amber-text: #b45309;
  --amber-bar: #f59e0b;
  --orange-bg: rgba(249, 115, 22, 0.12);
  --orange-text: #c2410c;
  --orange-bar: #f97316;
  --rose-bg: rgba(225, 29, 72, 0.1);
  --rose-text: #e11d48;
  --rose-bar: #e11d48;
  --blue-accent: #3b82f6;
}

/* Dark Mode Tokens */
body[data-theme='dark'] {
  --background: #262624;
  --foreground: #faf9f5;
  --card: #30302e;
  --card-foreground: #faf9f5;
  --card-subtle: #2b2b29;
  --popover: #30302e;
  --popover-foreground: #faf9f5;
  --primary: #d97757;
  --primary-hover: #e58768;
  --primary-foreground: #ffffff;
  --secondary: #3d3d3a;
  --secondary-foreground: #faf9f5;
  --muted: #3e3e38;
  --muted-foreground: #b7b5a9;
  --muted-light: #343431;
  --border: rgba(227, 224, 211, 0.16);
  --border-strong: rgba(227, 224, 211, 0.28);
  --input: #44443e;
  --ring: rgba(217, 119, 87, 0.35);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.25);
  --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5);

  --emerald-bg: rgba(16, 185, 129, 0.15);
  --emerald-text: #34d399;
  --amber-bg: rgba(245, 158, 11, 0.15);
  --amber-text: #fbbf24;
  --orange-bg: rgba(249, 115, 22, 0.18);
  --orange-text: #fb923c;
  --rose-bg: rgba(225, 29, 72, 0.18);
  --rose-text: #fb7185;
}

/* ==========================================================================
   Base & Reset
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  font-family: var(--font-sans);
  background-color: var(--background);
  color: var(--foreground);
  line-height: 1.5;
  min-height: 100vh;
  transition: background-color 0.2s ease, color 0.2s ease;
}
button, input, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  border: none;
  background: none;
}
a {
  color: inherit;
  text-decoration: none;
}
svg {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}
.tabular-nums {
  font-variant-numeric: tabular-nums;
}
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ==========================================================================
   Layout Containers
   ========================================================================== */
.preview-banner {
  background: color-mix(in srgb, var(--primary) 12%, var(--card));
  border-bottom: 1px solid color-mix(in srgb, var(--primary) 30%, var(--border));

  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;

}
.banner-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  background-color: color-mix(in srgb, var(--primary) 20%, transparent);
  color: var(--primary);
  font-weight: 600;
  font-size: 0.7rem;
}
.banner-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

/* Floating / Embedded State Switcher Bar */
.state-switcher-bar {
  background-color: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0.5rem 1.25rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 0;
  z-index: 30;
}
.state-label {
  font-weight: 600;
  color: var(--muted-foreground);
  margin-right: 0.25rem;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}
.state-btn {
  padding: 0.25rem 0.65rem;
  border-radius: 0.375rem;
  border: 1px solid var(--border);
  background-color: var(--card-subtle);
  color: var(--foreground);
  font-weight: 500;
  font-size: 0.75rem;
  transition: all 0.15s ease;
  min-height: 28px;
}
.state-btn:hover {
  background-color: var(--muted);
  border-color: var(--border-strong);
}
.state-btn.active {
  background-color: var(--primary);
  color: var(--primary-foreground);
  border-color: var(--primary);
  box-shadow: 0 1px 2px rgba(201, 100, 66, 0.3);
}

.theme-toggle-btn {
  margin-left: auto;
  padding: 0.25rem 0.65rem;
  border-radius: 0.375rem;
  border: 1px solid var(--border);
  background-color: var(--secondary);
  color: var(--foreground);
  font-size: 0.75rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  min-height: 28px;
}
.theme-toggle-btn:hover {
  background-color: var(--muted);
}

.app-container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 1.5rem;
}
@media (max-width: 768px) {
  .app-container {
    padding: 1rem;
  }
}

/* ==========================================================================
   Header Section (Aligning PageHeader)
   ========================================================================== */
.page-header {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}

}
.header-icon-box {

  border: 1px solid color-mix(in srgb, var(--primary) 24%, var(--border));

  align-items: center;
  justify-content: center;
  color: var(--primary);
}
.header-kicker {
  font-size: 0.65rem;
  font-weight: 700;

}
.header-title-wrap {

  align-items: center;

  flex-wrap: wrap;
  margin-top: 0.15rem;
}
.header-title {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--foreground);
}
.provider-badge {

  font-weight: 600;

}

.header-controls {

  align-items: center;

}
.select-trigger {
  height: 2.25rem;
  padding: 0 0.75rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background-color: var(--card);
  color: var(--foreground);
  font-size: 0.8rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  box-shadow: var(--shadow-sm);

}
.select-trigger:hover {
  border-color: var(--border-strong);
}
.select-trigger:focus-visible {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--ring);
}
.select-trigger.pool-select {
  min-width: 190px;
}
.refresh-btn {
  height: 2.25rem;
  padding: 0 0.85rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background-color: var(--card);
  color: var(--foreground);
  font-size: 0.8rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
}
.refresh-btn:hover {
  background-color: var(--muted-light);
  border-color: var(--border-strong);
}
.refresh-btn.spinning svg {
  animation: spin 1s linear infinite;
}

/* ==========================================================================
   Filter Panel
   ========================================================================== */
.filter-card {
  background-color: color-mix(in srgb, var(--muted) 35%, var(--card));

  border-radius: var(--radius-xl);
  padding: 1rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-sm);
}
.filter-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

}

  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--foreground);
}
.filter-header-title svg {
  color: var(--primary);
}
.filter-header-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.sort-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
}
.sort-label {
  color: var(--muted-foreground);
  font-weight: 500;
  white-space: nowrap;
}
.btn-ghost-sm {
  padding: 0.25rem 0.5rem;
  font-size: 0.75rem;
  color: var(--muted-foreground);
  border-radius: var(--radius);
  transition: color 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}
.btn-ghost-sm:hover {
  color: var(--foreground);
  background-color: var(--muted);
}

.custom-range-row {
  margin-top: 0.75rem;

  border-radius: var(--radius);
  border: 1px solid var(--border);

  flex-wrap: wrap;
  align-items: center;

  font-size: 0.75rem;
}
.custom-range-label {

}
.custom-date-input {

  border-radius: var(--radius);

}
.custom-date-input:focus-visible {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--ring);
}
.btn-outline-sm {
  height: 2rem;
  padding: 0 0.75rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background-color: var(--card);
  color: var(--foreground);
  font-size: 0.75rem;
  font-weight: 600;
  transition: all 0.15s ease;
}
.btn-outline-sm:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.filter-grid {
  margin-top: 0.85rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.85rem;
}

  .filter-grid {
    grid-template-columns: 1fr 1.6fr;
  }
}
.filter-search-col {
  background-color: color-mix(in srgb, var(--card) 75%, var(--background));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.col-kicker {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted-foreground);
}
.search-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.search-icon {
  position: absolute;
  left: 0.75rem;
  color: var(--muted-foreground);
  pointer-events: none;
}
.search-input {
  width: 100%;
  height: 2.25rem;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background-color: var(--card);
  color: var(--foreground);
  padding: 0 2.2rem 0 2.2rem;
  font-size: 0.75rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-input:focus-visible {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--ring);
}
.search-clear-btn {
  position: absolute;
  right: 0.65rem;
  width: 1.25rem;
  height: 1.25rem;
  border-radius: 9999px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted-foreground);
}
.search-clear-btn:hover {
  color: var(--foreground);
  background-color: var(--muted);
}

.filter-selects-col {
  background-color: color-mix(in srgb, var(--card) 75%, var(--background));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.selects-5-group {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.5rem;
}
@media (min-width: 640px) {
  .selects-5-group {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (min-width: 900px) {
  .selects-5-group {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
.filter-field {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.field-label {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--muted-foreground);
  white-space: nowrap;
}
.select-compact {
  height: 2rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background-color: var(--card);
  color: var(--foreground);
  font-size: 0.75rem;
  padding: 0 0.5rem;
  width: 100%;
}
.select-compact:focus-visible {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--ring);
}

/* ==========================================================================
   KPI Summary Cards
   ========================================================================== */
.kpi-section {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.85rem;
  margin-bottom: 1.5rem;
}
@media (min-width: 640px) {
  .kpi-section {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .kpi-section {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
.kpi-card {
  background-color: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  min-height: 108px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.kpi-card:hover {
  box-shadow: var(--shadow-md);
}
.kpi-card.accent-left::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background-color: var(--primary);
}
.kpi-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.5rem;
}
.kpi-label {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted-foreground);
}
.kpi-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--foreground);
  margin-top: 0.25rem;
  line-height: 1.2;
}
.kpi-icon {
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background-color: color-mix(in srgb, var(--muted) 40%, var(--card));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
}
.kpi-hint {
  font-size: 0.72rem;
  color: var(--muted-foreground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 0.4rem;
}

/* ==========================================================================
   Trend Chart Section
   ========================================================================== */
.trend-card {
  background-color: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-sm);
}
.trend-header {

  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;

.trend-title-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.trend-title {

}
.trend-legends {

  align-items: center;
  gap: 1rem;
  font-size: 0.75rem;
}
.legend-item {

  align-items: center;
  gap: 0.4rem;
  color: var(--muted-foreground);
}
.legend-box {

  height: 0.75rem;
  border-radius: 0.2rem;
}
.legend-box.token-in { background-color: #c96442; }
.legend-box.token-out { background-color: #e4b2a0; }

.chart-container-svg {
  width: 100%;
  height: 180px;
  position: relative;
}
.chart-tooltip {
  position: absolute;
  display: none;
  background: var(--card);
  border: 1px solid var(--border-strong);
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  font-size: 0.72rem;
  pointer-events: none;
  z-index: 20;
  white-space: nowrap;
}

/* ==========================================================================
   Account List Section & Cards
   ========================================================================== */
.list-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 0.75rem;
}
.list-title-wrap {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}
.list-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--foreground);
}

// Formatters
function formatInteger(num) {
  return new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 }).format(num || 0);
}
function formatCompactNumber(num) {
  return new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 }).format(num || 0);
}
function formatToken(num) {
  const n = num || 0;
  if (n >= 1000000) return `${(n / 1000000).toFixed(n >= 10000000 ? 1 : 2)}M`;
  if (n >= 1000) return `${(n / 1000).toFixed(n >= 100000 ? 0 : 1)}K`;
  return formatInteger(n);
}
function formatUsd(num) {
  const n = Number(num || 0);
  return `$${n.toFixed(n >= 100 ? 2 : 4)}`;
}
function formatPercent(num) {
  return num == null ? '—' : `${Number(num).toFixed(1)}%`;
}
function formatLatency(num) {
  if (num == null) return '—';
  return num >= 1000 ? `${(num / 1000).toFixed(2)}s` : `${Math.round(num)}ms`;
}
function formatShortDate(unixSecs) {
  if (!unixSecs) return '—';
  const d = new Date(unixSecs * 1000);
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const hr = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  return `${m}/${day} ${hr}:${min}`;
}
function lastUsedLabel(unixSecs) {
  if (!unixSecs) return '暂无使用记录';
  const diffSecs = Math.max(0, Math.floor(Date.now() / 1000 - unixSecs));
  if (diffSecs < 60) return '刚刚使用';
  if (diffSecs < 3600) return `${Math.floor(diffSecs / 60)} 分钟前`;
  if (diffSecs < 86400) return `${Math.floor(diffSecs / 3600)} 小时前`;
  return `最后使用 ${formatShortDate(unixSecs)}`;
}
function quotaSyncLabel(quota) {
  if (quota.freshness === 'fresh') {
    return quota.observed_at_unix_secs ? `已同步 ${formatShortDate(quota.observed_at_unix_secs)}` : '已同步';
  }
  if (quota.freshness === 'stale') {
    return quota.observed_at_unix_secs ? `上次同步 ${formatShortDate(quota.observed_at_unix_secs)}` : '同步较早';
  }
  return '尚未同步';
}
function syncClass(freshness) {
  if (freshness === 'fresh') return 'sync-good';
  if (freshness === 'stale') return 'sync-warning';
  return 'sync-unknown';
}
function rateClass(rate) {
  if (rate == null) return '';
  if (rate >= 98) return 'rate-good';
  if (rate < 90) return 'rate-bad';
  return '';
}
function riskBarClass(risk) {
  return risk || 'healthy';
}

// Filter and Sort Accounts
function getFilteredAccounts() {
  let list = [...MOCK_ACCOUNTS];

  // Pool filter
  if (state.selectedPoolId) {
    list = list.filter(a => a.pool_id === state.selectedPoolId);
  }

  // Search filter
  if (state.search.trim()) {
    const q = state.search.toLowerCase().trim();
    list = list.filter(a =>
      a.key_name.toLowerCase().includes(q) ||
      a.auth_type.toLowerCase().includes(q) ||
      a.plan_type.toLowerCase().includes(q)
    );
  }

  // 5 Filter Groups
  if (state.filters.usage !== 'all') {
    if (state.filters.usage === 'used') list = list.filter(a => a.request_count > 0);
    if (state.filters.usage === 'idle') list = list.filter(a => a.request_count === 0);
  }
  if (state.filters.risk !== 'all') {
    list = list.filter(a => {
      const windowRisk = a.quota?.windows?.[0]?.forecast?.risk || 'unknown';
      return windowRisk === state.filters.risk;
    });
  }
  if (state.filters.freshness !== 'all') {
    list = list.filter(a => a.quota?.freshness === state.filters.freshness);
  }
  if (state.filters.active !== 'all') {
    if (state.filters.active === 'active') list = list.filter(a => a.is_active);
    if (state.filters.active === 'inactive') list = list.filter(a => !a.is_active);
    if (state.filters.active === 'blocked') list = list.filter(a => a.status === 'blocked');
  }
  if (state.filters.result !== 'all') {
    if (state.filters.result === 'success') list = list.filter(a => a.success_rate != null && a.success_rate > 95);
    if (state.filters.result === 'failed') list = list.filter(a => (a.error_distribution?.length || 0) > 0 || (a.success_rate != null && a.success_rate < 95));
  }

  // Sorting
  list.sort((a, b) => {
    let factor = state.sortOrder === 'asc' ? 1 : -1;
    if (state.sortBy === 'cost') return factor * (a.total_cost_usd - b.total_cost_usd);
    if (state.sortBy === 'requests') return factor * (a.request_count - b.request_count);
    if (state.sortBy === 'tokens') return factor * (a.total_tokens - b.total_tokens);
    if (state.sortBy === 'quota') {
      const qA = a.quota?.windows?.[0]?.remaining_percent ?? 999;
      const qB = b.quota?.windows?.[0]?.remaining_percent ?? 999;
      return factor * (qA - qB);
    }
    if (state.sortBy === 'last_used') {
      const uA = a.last_used_at_unix_secs || 0;
      const uB = b.last_used_at_unix_secs || 0;
      return factor * (uA - uB);
    }
    return 0;
  });

  return list;
}

// Calculate Summary KPIs
function computeSummary(accounts) {
  const account_count = accounts.length;
  const used_account_count = accounts.filter(a => a.request_count > 0).length;
  const request_count = accounts.reduce((acc, a) => acc + a.request_count, 0);
  const total_tokens = accounts.reduce((acc, a) => acc + a.total_tokens, 0);
  const input_tokens = accounts.reduce((acc, a) => acc + a.input_tokens, 0);
  const output_tokens = accounts.reduce((acc, a) => acc + a.output_tokens, 0);
  const total_cost_usd = accounts.reduce((acc, a) => acc + a.total_cost_usd, 0);
  const actual_total_cost_usd = accounts.reduce((acc, a) => acc + a.actual_total_cost_usd, 0);

  const ratedAccounts = accounts.filter(a => a.success_rate != null);
  const success_rate = ratedAccounts.length ? (ratedAccounts.reduce((acc, a) => acc + a.success_rate, 0) / ratedAccounts.length) : 100;
  const cache_hit_rate = accounts.length ? (accounts.reduce((acc, a) => acc + a.cache_hit_rate, 0) / accounts.length) : 0;
  const p95_response_time_ms = 820;

  return {
    account_count,
    used_account_count,
    request_count,
    total_tokens,
    input_tokens,
    output_tokens,
    total_cost_usd,
    actual_total_cost_usd,
    success_rate,
    cache_hit_rate,
    p95_response_time_ms
  };
}

  const container = document.getElementById('stateContainer');

    return;

    container.innerHTML = renderNoPoolState();
    return;
  }

  // Normal View with filtered accounts
  const allFiltered = getFilteredAccounts();
  const summary = computeSummary(allFiltered);

  // Pagination slice
  const total = allFiltered.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));

// Render Single Account Card Row
function renderAccountCard(account) {
  const window0 = account.quota?.windows?.[0];
  const risk = window0?.forecast?.risk || 'healthy';

  return `

      <!-- Left Column: Identity & Status -->
      <div class="acc-col-identity">
        <div>
          <button type="button" class="acc-name-btn" onclick="openDrawer('${account.key_id}')" aria-label="查看 ${account.key_name} 诊断详情">
            <div class="acc-name-line">
              <span class="acc-name-text" title="${account.key_name}">${account.key_name}</span>
              ${account.plan_type ? `<span class="plan-badge">${account.plan_type}</span>` : ''}
            </div>
            <div class="acc-meta-line">
              <span class="status-dot ${account.is_active ? 'active' : 'inactive'}"></span>
              <span>${account.is_active ? '已启用' : '已停用'} · ${account.auth_type}</span>
            </div>
          </button>
        </div>

        <div>
          <span class="sync-pill ${syncClass(account.quota?.freshness)}">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
            ${quotaSyncLabel(account.quota)}
          </span>
        </div>
      </div>

      <!-- Middle Column: Quota & 6 Metrics -->
      <div class="acc-col-body">
        <!-- Quota Progress Meter -->
        <div class="quota-box">
          <div class="quota-box-header">
            <span class="quota-box-title">额度与重置周期</span>
            ${account.quota?.windows?.length ? `<span class="quota-window-count-tag">${account.quota.windows.length} 个窗口</span>` : ''}
          </div>

          ${window0 ? `
            <div class="quota-card-inner">
              <div class="quota-inner-topline">
                <span class="quota-window-name" title="${window0.label}">${window0.label}</span>
                <strong class="quota-remaining-val">${window0.remaining_percent.toFixed(1)}% 可用</strong>
              </div>
              <div class="meter-track" aria-hidden="true">
                <div class="meter-fill ${riskBarClass(risk)}" style="width: ${window0.remaining_percent}%;"></div>
              </div>
              <div class="quota-inner-footer">
                <span>已用 ${window0.used_value != null ? formatCompactNumber(window0.used_value) : '—'} ${window0.unit || ''}</span>
                <span>重置于 ${formatShortDate(window0.reset_at_unix_secs)}</span>
              </div>
            </div>
          ` : `
            <div class="quota-card-inner" style="text-align: center; color: var(--muted-foreground); padding: 0.75rem;">
              <span>${account.quota?.message || '账号未提供额度数据'}</span>
            </div>
          `}
        </div>

        <!-- 6 Metrics Grid -->
        <div class="metrics-6-grid">
          <div class="metric-cell">
            <span class="metric-cell-label">请求</span>
            <strong class="metric-cell-val tabular-nums">${formatInteger(account.request_count)}</strong>
          </div>
          <div class="metric-cell">
            <span class="metric-cell-label">Token</span>
            <strong class="metric-cell-val tabular-nums">${formatToken(account.total_tokens)}</strong>
          </div>
          <div class="metric-cell">
            <span class="metric-cell-label">成功率</span>
            <strong class="metric-cell-val tabular-nums ${rateClass(account.success_rate)}">${formatPercent(account.success_rate)}</strong>
          </div>
          <div class="metric-cell">
            <span class="metric-cell-label">P95 响应</span>
            <strong class="metric-cell-val tabular-nums">${formatLatency(account.p95_response_time_ms)}</strong>
          </div>
          <div class="metric-cell">
            <span class="metric-cell-label">缓存命中</span>
            <strong class="metric-cell-val tabular-nums">${formatPercent(account.cache_hit_rate)}</strong>
          </div>
          <div class="metric-cell">
            <span class="metric-cell-label">费用</span>
            <strong class="metric-cell-val tabular-nums">${formatUsd(account.total_cost_usd)}</strong>
          </div>
        </div>
      </div>

}

// Render Daily SVG Trend Chart
function renderTrendChartSvg() {
  const days = [
    { label: '08/10', inTokens: 1200000, outTokens: 420000, cost: 4.80 },
    { label: '08/11', inTokens: 1850000, outTokens: 610000, cost: 7.20 },
    { label: '08/12', inTokens: 1400000, outTokens: 520000, cost: 5.60 },
    { label: '08/13', inTokens: 2100000, outTokens: 780000, cost: 8.40 },
    { label: '08/14', inTokens: 1950000, outTokens: 690000, cost: 7.90 },
    { label: '08/15', inTokens: 2450000, outTokens: 890000, cost: 9.80 },
    { label: '08/16', inTokens: 1600000, outTokens: 580000, cost: 6.40 }
  ];

  const maxTokens = 3500000;
  const maxCost = 12.0;
  const width = 800;
  const height = 160;
  const paddingX = 40;
  const paddingBottom = 30;
  const chartHeight = height - paddingBottom;
  const barGroupWidth = (width - paddingX * 2) / days.length;
  const barWidth = 24;

  let barsSvg = '';
  let linePoints = [];

  days.forEach((d, idx) => {
    const x = paddingX + idx * barGroupWidth + (barGroupWidth - barWidth) / 2;
    const totalTokens = d.inTokens + d.outTokens;
    const barH = (totalTokens / maxTokens) * (chartHeight - 20);
    const inH = (d.inTokens / maxTokens) * (chartHeight - 20);
    const outH = (d.outTokens / maxTokens) * (chartHeight - 20);

    const yOut = chartHeight - barH;
    const yIn = yOut + outH;

    // SVG Bars
    barsSvg += `
      <!-- Out Tokens Bar -->
      <rect x="${x}" y="${yOut}" width="${barWidth}" height="${outH}" rx="3" fill="#e4b2a0" opacity="0.9" />
      <!-- In Tokens Bar -->
      <rect x="${x}" y="${yIn}" width="${barWidth}" height="${inH}" rx="3" fill="#c96442" opacity="0.95" />
      <!-- Day Label -->
      <text x="${x + barWidth / 2}" y="${height - 8}" text-anchor="middle" font-size="11" fill="var(--muted-foreground)">${d.label}</text>
    `;

    // Cost line coordinate
    const costY = chartHeight - (d.cost / maxCost) * (chartHeight - 20);
    linePoints.push(`${x + barWidth / 2},${costY}`);
  });

  const polylineSvg = `<polyline fill="none" stroke="#477074" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${linePoints.join(' ')}" />`;
  const dotsSvg = linePoints.map((pt, i) => `<circle cx="${pt.split(',')[0]}" cy="${pt.split(',')[1]}" r="4" fill="#ffffff" stroke="#477074" stroke-width="2.5" />`).join('');

  return `
    <svg viewBox="0 0 ${width} ${height}" style="width: 100%; height: 100%; overflow: visible;" preserveAspectRatio="none">
      <!-- Grid lines -->
      <line x1="${paddingX}" y1="${chartHeight * 0.25}" x2="${width - paddingX}" y2="${chartHeight * 0.25}" stroke="var(--border)" stroke-dasharray="4" opacity="0.6"/>
      <line x1="${paddingX}" y1="${chartHeight * 0.5}" x2="${width - paddingX}" y2="${chartHeight * 0.5}" stroke="var(--border)" stroke-dasharray="4" opacity="0.6"/>
      <line x1="${paddingX}" y1="${chartHeight * 0.75}" x2="${width - paddingX}" y2="${chartHeight * 0.75}" stroke="var(--border)" stroke-dasharray="4" opacity="0.6"/>
      <line x1="${paddingX}" y1="${chartHeight}" x2="${width - paddingX}" y2="${chartHeight}" stroke="var(--border)"/>

      ${barsSvg}
      ${polylineSvg}
      ${dotsSvg}
    </svg>
  `;
}

// ==========================================================================
// DRAWER RENDERING & LOGIC
// ==========================================================================

function openDrawer(keyId) {
  const account = MOCK_ACCOUNTS.find(a => a.key_id === keyId) || MOCK_ACCOUNTS[0];
  state.selectedAccount = account;
  state.activeQuotaIndex = 0;
  state.drawerState = 'normal';
  state.drawerOpen = true;

  document.getElementById('drawerTitle').innerText = account.key_name;
  document.getElementById('accountDrawer').classList.add('open');
  renderDrawerContent();
}

function closeDrawer() {
  state.drawerOpen = false;
  document.getElementById('accountDrawer').classList.remove('open');
}

function handleBackdropClick(event) {
  if (event.target === document.getElementById('accountDrawer')) {
    closeDrawer();
  }
}

function renderDrawerContent() {

      </div>

        <span class="detail-metric-label">Token 消耗</span>

      </div>
      <div class="detail-metric-box">
        <span class="detail-metric-label">成功率</span>
        <strong class="detail-metric-val tabular-nums ${rateClass(account.success_rate)}">${formatPercent(account.success_rate)}</strong>

        <strong class="detail-metric-val tabular-nums">${formatLatency(account.p95_response_time_ms)}</strong>

    </div>

      <div class="detail-section-header">
        <h3 class="detail-section-title">Token 与费用趋势</h3>

          <div style="height: 100px; display: flex; align-items: flex-end; gap: 6px; padding-top: 10px;">

            <strong class="chart-subcard-val tabular-nums">${formatUsd(account.total_cost_usd)}</strong>
          </div>
          <div style="height: 100px; display: flex; align-items: flex-end; gap: 6px; padding-top: 10px;">
            ${[25, 45, 30, 65, 50, 80, 42].map((h, i) => `
              <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">

          </div>
        </div>
      </div>
    </section>

    <!-- 3. Quota Window Navigation & Meter -->
    <section class="detail-card-section quota-accent" aria-label="额度与重置周期">

      </div>

      ${currentWindow ? `

        <div class="quota-nav-box" aria-label="额度窗口导航">
          <button
            class="quota-nav-arrow"

          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>

          <div class="quota-nav-center">
            <span class="quota-nav-count">${state.activeQuotaIndex + 1} / ${windows.length} 个窗口</span>
            <strong class="quota-nav-name">${currentWindow.label}</strong>
            <span class="quota-nav-range">重置于 ${formatShortDate(currentWindow.reset_at_unix_secs)}</span>
          </div>

          <button
            class="quota-nav-arrow"
            ${state.activeQuotaIndex <= 0 ? 'disabled' : ''}
            onclick="shiftQuotaCycle(-1)"
            aria-label="查看更新的额度窗口"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <div class="window-detail-card">
          <div class="quota-inner-topline">
            <span class="quota-window-name">${currentWindow.model || '标准模型'} · ${currentWindow.label}</span>
            <strong class="quota-remaining-val">${currentWindow.remaining_percent.toFixed(1)}% 可用</strong>
          </div>
          <div class="meter-track" aria-hidden="true" style="height: 6px; margin: 0.5rem 0;">
            <div class="meter-fill ${riskBarClass(currentWindow.forecast?.risk)}" style="width: ${currentWindow.remaining_percent}%;"></div>
          </div>
          <div class="quota-inner-footer">
            <span>已用 ${formatCompactNumber(currentWindow.used_value || 0)} ${currentWindow.unit || ''}</span>
            <span>周期重置时间：${formatShortDate(currentWindow.reset_at_unix_secs)}</span>
          </div>
          <div class="window-facts-row">
            <span>本窗口请求：<strong>${formatInteger(account.request_count)}</strong></span>
            <span>本窗口 Token：<strong>${formatToken(account.total_tokens)}</strong></span>
            <span>本窗口费用：<strong>${formatUsd(account.total_cost_usd)}</strong></span>
          </div>
        </div>
      ` : `
        <div style="text-align: center; color: var(--muted-foreground); padding: 1rem;">
          <p>${account.quota?.message || '当前账号没有可展示的额度窗口'}</p>
        </div>
      `}
    </section>

    <!-- 4. Model & Failed Request Distributions (2 Columns) -->
    <div class="distributions-2col">
      <!-- Model Distribution -->
      <section class="detail-card-section dist-accent" aria-label="模型使用分布">
        <div class="detail-section-header">
          <h3 class="detail-section-title">模型使用分布</h3>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.65rem;">
          ${(account.model_distribution && account.model_distribution.length > 0) ? account.model_distribution.map(m => {

        <div class="detail-section-header">
          <h3 class="detail-section-title">失败请求分布</h3>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.65rem;">
          ${(account.error_distribution && account.error_distribution.length > 0) ? account.error_distribution.map(e => `
            <div class="dist-item-row">
              <div class="dist-item-top">

              </div>
              <div class="dist-bar-track">

              </div>
            </div>
          `).join('') : `

          `}
        </div>
      </section>
    </div>
  `;
}

function shiftQuotaCycle(offset) {
  const windows = state.selectedAccount?.quota?.windows || [];
  const nextIdx = state.activeQuotaIndex + offset;
  if (nextIdx >= 0 && nextIdx < windows.length) {
    state.activeQuotaIndex = nextIdx;
    renderDrawerContent();
  }
}

function switchDrawerState(targetState) {
  state.drawerState = targetState;
  document.querySelectorAll('.drawer-state-btn').forEach(btn => {
    btn.classList.toggle('active', btn.innerText.includes(
      targetState === 'normal' ? '正常' :
      targetState === 'loading' ? '加载中' :
      targetState === 'error' ? '加载失败' : '无记录'
    ));
  });
  renderDrawerContent();
}

// ==========================================================================
// STATE & EVENT HANDLERS
// ==========================================================================

function switchMainState(newState) {
  state.mainState = newState;
  document.querySelectorAll('.state-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${newState}'`));
  });
  renderApp();
}

function toggleTheme() {
  const current = document.body.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', next);

  const themeText = document.getElementById('themeText');
  if (themeText) {
    themeText.innerText = next === 'light' ? '切换深色' : '切换浅色';
  }
}

function handlePoolChange(poolId) {
  state.selectedPoolId = poolId;
  state.page = 1;
  renderApp();
}

function handleRangeChange(rangeVal) {
  state.range = rangeVal;
  state.customRangeActive = (rangeVal === 'custom');
  state.page = 1;
  renderApp();
}

function handleApplyCustomDate() {
  const startEl = document.getElementById('customStartDate');
  const endEl = document.getElementById('customEndDate');
  if (startEl && endEl) {
    state.customStartDate = startEl.value;
    state.customEndDate = endEl.value;
  }
  alert(`已应用自定义日期范围: ${state.customStartDate} 至 ${state.customEndDate}`);
  renderApp();
}

function handleSearchInput(val) {
  state.search = val;
  state.page = 1;
  renderApp();
}

function handleClearSearch() {
  state.search = '';
  state.page = 1;
  renderApp();
}

function handleFilterUpdate(group, val) {
  state.filters[group] = val;
  state.page = 1;
  renderApp();
}

function handleSortPreset(val) {
  const [field, order] = val.split(':');
  state.sortBy = field;
  state.sortOrder = order;
  renderApp();
}

function handleResetFilters() {
  state.search = '';
  state.filters = {
    usage: 'all',
    risk: 'all',
    freshness: 'all',
    active: 'all',
    result: 'all'
  };
  state.sortBy = 'cost';
  state.sortOrder = 'desc';
  state.page = 1;
  renderApp();
}

function handleRefresh() {
  state.refreshing = true;
  renderApp();
  setTimeout(() => {
    state.refreshing = false;
    renderApp();
  }, 600);
}

function changePage(newPage) {
  state.page = newPage;
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changePageSize(size) {
  state.pageSize = size;
  state.page = 1;
  renderApp();
}

// Keyboard shortcuts (Escape key closes drawer)
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.drawerOpen) {
    closeDrawer();
  }
});

// State Placeholders HTML

// Initial render
document.addEventListener('DOMContentLoaded', () => {
  renderApp();
});
renderApp();
</script>
