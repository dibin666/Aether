name: Publish Aether M image

on:
  push:

permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aether-m
  VPS_COMPAT_IMAGE_NAME: aether-app

jobs:
  version:
    name: Resolve image version
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.version.outputs.image }}
      vps_image: ${{ steps.version.outputs.vps_image }}
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - name: Calculate version from workflow run
        id: version
        shell: bash
        run: |
          set -euo pipefail

          run_index=$((GITHUB_RUN_NUMBER - 1))
          major=$((9 + run_index / 10))
          minor=$((run_index % 10))
          version="${major}.${minor}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "vps_image=${REGISTRY}/${owner}/${VPS_COMPAT_IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_version=aether-m${version}" >> "${GITHUB_OUTPUT}"

  frontend:
    name: Build frontend
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          AETHER_BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          AETHER_VERSION: ${{ needs.version.outputs.build_version }}
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            arch: amd64
          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-image-${{ matrix.target }}
          workspaces: . -> target

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build Linux binary
        env:
          AETHER_BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          AETHER_VERSION: ${{ needs.version.outputs.build_version }}
          AETHER_BUILD_TYPE: release
          CARGO_TERM_COLOR: always
        run: cross build --release --locked -p aether-gateway --features jemalloc --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: aether-gateway-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-architecture image
    needs: [version, frontend, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare image context
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          install -m 0755 artifacts/aether-gateway-linux-amd64/aether-gateway dist/aether-gateway-amd64
          install -m 0755 artifacts/aether-gateway-linux-arm64/aether-gateway dist/aether-gateway-arm64
          cp -r artifacts/frontend-dist dist/frontend
          test -x dist/aether-gateway-amd64
          test -x dist/aether-gateway-arm64
          test -s dist/frontend/index.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.vps_image }}:m${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.build_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
